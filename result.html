<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتیجه | هم‌روح کدام شاعری؟</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            background: url('images/background.png') center center / cover no-repeat fixed;
            color: #1B2A4A;
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 16px;
        }
        @media (max-width: 768px) {
            body { background: url('images/mobile-background.png') center top / cover no-repeat; background-attachment: scroll; padding: 20px 10px; }
        }
        
        .container {
            width: 100%; max-width: 820px;
            background: rgba(253,251,247,0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(197,160,89,0.35);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            padding: 40px 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        @media (max-width: 768px) { 
            .container { padding: 50px 16px 20px; }
        }
        
        /* ==========================================
           اصلاح دکمه بازگشت (هماهنگ با سایر صفحات)
           ========================================== */
        .back-pill-top {
            position: absolute !important;
            top: 24px !important;
            right: 24px !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            background: rgba(253, 250, 245, 0.8) !important; /* پس‌زمینه کرم شفاف */
            border: 1px solid rgba(197, 160, 89, 0.4) !important;
            border-radius: 30px !important;
            padding: 6px 16px !important;
            color: #1B2A4A !important;
            text-decoration: none !important; /* حذف خط زیر */
            font-size: 13px !important;
            font-weight: 500 !important;
            transition: all 0.3s ease !important;
            z-index: 20 !important;
        }
        .back-pill-top:hover {
            background: #F4EAD4 !important;
            border-color: #C5A059 !important;
            transform: translateX(-3px) !important;
        }
        .back-pill-arrow {
            font-size: 14px !important;
            line-height: 1 !important;
            display: inline-block !important;
        }
        
        /* تیتر اصلی */
        .result-header-glass {
            background: transparent;
            text-align: center;
            padding: 10px 20px;
            margin-top: 10px;
        }

        .result-title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .result-flourish {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #C5A059;
        }

        .result-flourish .r-line {
            width: 40px;
            height: 1px;
            background: #C5A059;
            opacity: 0.6;
        }

        .result-flourish .r-diamond {
            font-size: 14px;
        }

        .result-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 2.3rem;
            color: #1B2A4A;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.9);
        }

        .result-tagline {
            font-size: 0.8rem;
            color: #1B2A4A;
            font-weight: 400;
            margin: 0 0 15px 0;
            opacity: 0.85;
        }

        .result-white-card {
            background: #ffffff;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(27, 42, 74, 0.08);
            border: 1px solid #EFE6D8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        /* تزئینات کنار اسم شاعر */
        .result-poet-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .poet-flourish {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #C5A059;
        }
        .poet-flourish .p-line {
            width: 30px;
            height: 1px;
            background: #C5A059;
            opacity: 0.6;
        }
        .poet-flourish .p-diamond {
            font-size: 16px;
            line-height: 0;
        }

        /* فونت نام شاعر: ساحل */
        .result-poet-name {
            font-family: 'Sahel', 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: #1B2A4A;
            margin: 0;
            background: transparent; 
            padding: 0;
        }

        .result-poet-desc {
            font-size: 1rem;
            color: #444;
            line-height: 2;
            text-align: center;
            max-width: 600px;
        }

        .works-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B2A4A;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0 10px;
        }
        
        .works-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #C5A059;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .works-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .works-list li {
            background: #FBF6EB;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 14px;
            color: #1B2A4A;
            border: 1px solid rgba(197,160,89,0.15);
        }

        /* دکمه آزمون دوباره */
        .btn-retake {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1B2A4A;
            color: #F4EAD4;
            text-decoration: none;
            padding: 8px 25px;
            border-radius: 50px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(27, 42, 74, 0.15);
            margin-top: 10px;
        }
        .btn-retake:hover {
            background: #274062;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(27, 42, 74, 0.25);
        }

        footer {
            margin-top: 30px; text-align: center;
            font-size: 12px; color: #888; line-height: 1.8;
            border-top: 1px solid rgba(197,160,89,0.2); padding-top: 16px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .back-pill-top { top: 15px !important; right: 15px !important; font-size: 11px !important; padding: 4px 10px !important; }
            .result-title { 
        font-size: 1.8rem !important; white-space: nowrap !important; }
            .result-flourish .r-line { width: 20px; }
            .result-white-card { padding: 25px 20px; }
            .result-poet-name { font-size: 1.45rem; }
            .poet-flourish .p-line { width: 20px; }
            .result-poet-desc { font-size: 0.95rem; }
            .btn-retake { padding: 6px 20px; font-size: 0.85rem; }
            footer { font-size: 11px; margin-top: 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- دکمه بازگشت (سمت راست بالا، اصلاح شده) -->
    <a href="personality.html" class="back-pill-top">
        <span class="back-pill-arrow">→</span>
        <span>بازگشت به صفحه معرفی</span>
    </a>

    <!-- بخش هدر -->
    <div class="result-header-glass">
        <div class="result-title-wrap">
            <div class="result-flourish">
                <span class="r-line"></span>
                <span class="r-diamond">✦</span>
                <span class="r-line"></span>
            </div>
            <h1 class="result-title">نتیجه آزمون</h1>
            <div class="result-flourish">
                <span class="r-line"></span>
                <span class="r-diamond">✦</span>
                <span class="r-line"></span>
            </div>
        </div>

        <p class="result-tagline">شخصیت شما به کدام شاعر فارسی نزدیک‌تر است؟</p>
    </div>

    <!-- بخش کارت سفید -->
    <section class="result-white-card">
        
        <!-- اسم شاعر با تزئینات کنارش -->
        <div class="result-poet-wrap">
            <div class="poet-flourish">
                <span class="p-line"></span>
                <span class="p-diamond">•</span>
                <span class="p-line"></span>
            </div>
            <h2 class="result-poet-name" id="poetName">—</h2>
            <div class="poet-flourish">
                <span class="p-line"></span>
                <span class="p-diamond">•</span>
                <span class="p-line"></span>
            </div>
        </div>

        <p class="result-poet-desc" id="poetDescription">...</p>
        
        <div class="works-title">
            <svg class="works-icon" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16"/>
                <path d="M4 6v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2z"/>
            </svg>
            آثار مهم
        </div>
        <ul class="works-list" id="poetWorks"></ul>
        
        <a href="test.html" class="btn-retake">
            <span>آزمون دوباره</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </a>
    </section>

    <footer>
        طراحی و توسعه: ریحانه زارع<br>
        پروژه درس ادبیات فارسی | تابستان ۱۴۰۵<br>
        © تمامی حقوق این پروژه محفوظ است.
    </footer>
</div>

<script>
    let winner = localStorage.getItem("winnerPoet");

    let poetInfo = {
        molana: {
            name: "مولانا",
            description: "روح تو با مولانا هم‌نواست. تو در اعماق عرفان و معنا سیر می‌کنی، به دنبال وصال و کشف رازهای نهفته در هستی هستی. نگاه تو به جهان، نگاهی عاشقانه و در عین حال فلسفی است.",
            works: ["مثنوی معنوی", "دیوان شمس", "فیه ما فیه"]
        },
        hafez: {
            name: "حافظ",
            description: "با حافظ هم‌روحی. تو عاشقانه به جهان می‌نگری و در عین حال، با نگاهی عمیق و پرسشگر، لایه‌های پنهان حقیقت را جست‌وجو می‌کنی. درونت عشق و خرد را همزمان در آغوش می‌گیری.",
            works: ["دیوان حافظ"]
        },
        ferdowsi: {
            name: "فردوسی",
            description: "همچون فردوسی، شجاع و استوار. تو پاسدار ارزش‌های انسانی و اخلاقی هستی و در برابر ناعدالتی‌ها با صلابت می‌ایستی. حماسه و عظمت درون تو موج می‌زند.",
            works: ["شاهنامه"]
        },
        saadi: {
            name: "سعدی",
            description: "سعدی، حکیم خردمند و عاشق‌پیشه‌ای که عشق و اخلاق را در هم آمیخت. روحیه مهربان، اجتماعی و انسان‌دوست تو، با نگاه ظریف و موشکافانه او به جهان هماهنگی کامل دارد.",
            works: ["گلستان", "بوستان"]
        },
        khayyam: {
            name: "خیام",
            description: "هم‌نفس با خیام. تو پرسشگر و آزاداندیش هستی، و لحظه‌های ناب زندگی را در دل رازهای هستی جست‌وجو می‌کنی. فلسفه و هنر در نگاه تو در هم آمیخته‌اند.",
            works: ["رباعیات خیام"]
        },
        forough: {
            name: "فروغ فرخزاد",
            description: "در روح تو، آتشی از خلاقیت و حساسیت می‌سوزد. تو همچون فروغ، جهان را با نگاهی نو و عمیق می‌بینی و از بیان احساساتت هراسی نداری. شعر برای تو، تنفس است.",
            works: ["تولدی دیگر", "ایمان بیاوریم به آغاز فصل سرد"]
        },
        sohrab: {
            name: "سهراب سپهری",
            description: "با سهراب سپهری هم‌سفر. تو لطیف و آرامی، زیبایی‌های پنهان در دل سادگی و طبیعت را به خوبی درک می‌کنی. برای تو، هر برگ درخت یک آیه از کتاب زندگی است.",
            works: ["هشت کتاب"]
        },
        nima: {
            name: "نیما یوشیج",
            description: "نوگرا و متفاوت. تو روحیه‌ای به وسعت نیمای بزرگ داری و عاشق شکستن قالب‌ها و نگاه به جهان از زاویه‌ای تازه هستی. تو پیشگام تفکرات جدیدی.",
            works: ["افسانه"]
        },
        shahriar: {
            name: "شهریار",
            description: "شهریار، شاعر احساس. تو به خاطرات و روابط انسانی عمیقاً وفاداری و با دلی صمیمی و احساساتی، به جهان می‌نگری. همیشه برایت مهم‌ترین چیز، مهر و انسانیت است.",
            works: ["حیدربابایه سلام", "دیوان شهریار"]
        },
        parvin: {
            name: "پروین اعتصامی",
            description: "پروین، بانوی اخلاق. تو عدالت‌خواه و دلسوزی، و به مانند پروین با کلام خود، می‌خواهی تأثیری مثبت بر دیگران بگذاری. دغدغه تو، بهبود دنیای اطرافت است.",
            works: ["دیوان پروین اعتصامی"]
        },
        bidel: {
            name: "بیدل دهلوی",
            description: "بیدل، شاعر پیچیدگی‌ها. تو به عمق و پیچیدگی‌های زندگی علاقه‌مندی و از تأمل در مفاهیم پنهان و فلسفی لذت می‌بری. ذهن تو، دریایی از پرسش‌هاست.",
            works: ["دیوان بیدل"]
        },
        saeb: {
            name: "صائب تبریزی",
            description: "صائب، شاعر نگاه‌های تازه. تو دقیق و خلاق هستی و با نگاهی موشکافانه به جزئیات، زیبایی‌های نهفته در دنیای اطرافت را کشف می‌کنی. هر لحظه برای تو، یک شعر است.",
            works: ["دیوان صائب"]
        }
    };

    if (winner && poetInfo[winner]) {
        let poet = poetInfo[winner];
        document.getElementById("poetName").textContent = poet.name;
        document.getElementById("poetDescription").textContent = poet.description;

        let worksList = document.getElementById("poetWorks");
        poet.works.forEach(function(work) {
            let li = document.createElement("li");
            li.textContent = work;
            worksList.appendChild(li);
        });
    } else {
        document.getElementById("poetName").textContent = "نتیجه‌ای یافت نشد";
        document.getElementById("poetDescription").textContent = "لطفاً ابتدا در آزمون شرکت کنید.";
    }
</script>
</body>
</html>
